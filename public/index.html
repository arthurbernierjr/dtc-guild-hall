<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guild hall</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hall-page">
    <p class="eyebrow">Unit 4 · example</p>
    <h1>Guild hall</h1>
    <p class="lede">Register two accounts, send a note, and the inbox only shows mail addressed to the signed-in user.</p>
    <div class="gates">
      <form id="register" class="panel">
        <h2>Register</h2>
        <label><span>Name</span><input name="name" required></label>
        <label><span>Email</span><input name="email" type="email" required autocomplete="username"></label>
        <label><span>Password</span><input name="password" type="password" minlength="8" required autocomplete="new-password"></label>
        <button type="submit">Create account</button>
      </form>
      <form id="login" class="panel">
        <h2>Login</h2>
        <label><span>Email</span><input name="email" type="email" required autocomplete="username"></label>
        <label><span>Password</span><input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Enter</button>
      </form>
    </div>
    <p id="error" class="status" role="status"></p>
    <section id="hall" class="desk" hidden>
      <p id="who" class="who"></p>
      <h2>Inbox</h2>
      <ul id="inbox" class="inbox"></ul>
      <form id="send" class="send">
        <label><span>To user id</span><input name="to" required></label>
        <label><span>Note</span><input name="body" required></label>
        <button type="submit">Send</button>
      </form>
    </section>
    <div class="marquee" aria-hidden="true"><b><span>Register</span><span>Inbox</span><span>Inventory</span><span>Register</span><span>Inbox</span><span>Inventory</span></b></div>
  </main>
  <script>
    let token = "";
    const hall = document.querySelector("#hall");
    const error = document.querySelector("#error");
    async function api(path, options) {
      const response = await fetch(path, {
        ...options,
        headers: {
          "content-type": "application/json",
          ...(token ? { authorization: "Bearer " + token } : {}),
          ...(options && options.headers),
        },
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || response.statusText);
      return body;
    }
    document.querySelector("#register").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      try {
        const result = await api("/api/register", { method: "POST", body: JSON.stringify(data) });
        token = result.token;
        error.textContent = "";
        show(result.user);
      } catch (err) { error.textContent = err.message; }
    });
    document.querySelector("#login").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      try {
        const result = await api("/api/login", { method: "POST", body: JSON.stringify(data) });
        token = result.token;
        error.textContent = "";
        show(result.user);
      } catch (err) { error.textContent = err.message; }
    });
    async function show(user) {
      hall.hidden = false;
      const who = document.querySelector("#who");
      who.replaceChildren();
      const name = document.createElement("strong");
      name.textContent = user.name;
      const id = document.createElement("code");
      id.textContent = user.id;
      who.append(name, id);
      const notes = await api("/api/inbox");
      document.querySelector("#inbox").replaceChildren(...notes.map((note) => {
        const item = document.createElement("li");
        item.className = "inbox__item";
        const from = document.createElement("span");
        from.className = "inbox__from";
        from.textContent = note.from && note.from.name ? note.from.name : "someone";
        const body = document.createElement("span");
        body.textContent = note.body;
        item.append(from, body);
        return item;
      }));
    }
    document.querySelector("#send").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      try {
        await api("/api/messages", { method: "POST", body: JSON.stringify(data) });
        error.textContent = "Sent.";
        event.target.reset();
      } catch (err) { error.textContent = err.message; }
    });
  </script>
</body>
</html>
